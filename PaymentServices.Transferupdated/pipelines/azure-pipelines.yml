# =============================================================================
# PaymentServices.Transfer — Azure DevOps Build Pipeline
# =============================================================================
name: $(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  - develop
  - release
  - main

parameters:
  - name: FunctionAppName
    displayName: FunctionAppName
    type: string
    default: PaymentServices.Transfer
  - name: buildConfiguration
    displayName: Build Configuration
    type: string
    default: Release
    values:
      - Release
      - Debug

resources:
  repositories:
    - repository: templates
      type: git
      name: "Payments Common Services/Evolve.Digital.DevOps"
      ref: refs/heads/develop

extends:
  template: Service_Pipelines/function_app_template.yml@templates
  parameters:
    FunctionAppName: PaymentServices.Transfer
    ProjectPath: src
    DeployParametersPath: deploy_parameters
    buildConfiguration: ${{ parameters.buildConfiguration }}